name: Shipping runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      export-image:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Host dev assets are test fixtures only, never production image layers.
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - name: Build exact production Dockerfile
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: |
          mkdir -p runtime-evidence
          git rev-parse HEAD > runtime-evidence/commit.txt
          uname -a > runtime-evidence/host.txt
          docker version >> runtime-evidence/host.txt
          sha256sum Dockerfile .dockerignore package-lock.json deploy/chromium-seccomp-amd64.json > runtime-evidence/inputs.sha256
          docker buildx build --load --platform linux/amd64 --metadata-file runtime-evidence/build.json --label org.opencontainers.image.source=https://github.com/johnnyrobot/adapt-a11y-scanner-dev --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label org.libretexts.release-status=non-release-candidate --tag "scanner-proof:${GITHUB_SHA}" . 2>&1 | tee runtime-evidence/build.log
          docker image inspect "scanner-proof:${GITHUB_SHA}" > runtime-evidence/image.json
      - name: Prove actual image renderer, lifecycle and Docker stop
        run: bash .github/scripts/prove-shipping-runtime.sh "scanner-proof:${GITHUB_SHA}" runtime-evidence
      - name: Save tested production image for this trusted candidate run only
        if: inputs.export-image && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'johnnyrobot/adapt-a11y-scanner-dev'
        run: |
          mkdir -p candidate-image
          docker save "scanner-proof:${GITHUB_SHA}" | gzip -1 > candidate-image/image.tar.gz
          python3 .github/scripts/check-image-archive.py > runtime-evidence/layer-audit.json
          node .github/scripts/candidate-record.mjs create
      - uses: actions/upload-artifact@v4
        if: inputs.export-image && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'johnnyrobot/adapt-a11y-scanner-dev'
        with:
          name: trusted-candidate-image
          path: candidate-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Diagnose failed launch under the unchanged shipping policy
        if: failure()
        run: |
          docker run --rm --init --network none --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --security-opt seccomp="$PWD/deploy/chromium-seccomp-amd64.json" \
            --shm-size 1g --stop-timeout 20 \
            --mount type=bind,src="$PWD/test",dst=/app/test,readonly \
            --mount type=bind,src="$PWD/runtime-evidence",dst=/evidence \
            --env DOTENV_CONFIG_PATH=/dev/null --entrypoint node "scanner-proof:${GITHUB_SHA}" \
            test/integration/container-launch-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-linux-amd64-shipping-runtime
          path: runtime-evidence/
          if-no-files-found: error
