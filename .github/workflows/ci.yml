name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the workflow token in .git/config: `npm ci` can run
          # dependency lifecycle scripts, and nothing here needs Git auth after
          # the checkout.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test "test/**/*.test.mjs"

  chromium-sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require non-root user namespaces
        run: |
          test "$(id -u)" -ne 0
          unshare --user --map-root-user --pid --fork true
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify real renderer sandbox and capture
        run: timeout 240s npm run test:browser
        env:
          SANDBOX_LINUX_REQUIRED: '1'
          SANDBOX_EVIDENCE_PATH: sandbox-evidence.json
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-sandbox-evidence
          path: sandbox-evidence.json
          if-no-files-found: warn
